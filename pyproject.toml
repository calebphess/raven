[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "raven"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "python-dotenv>=1.0.0",
    "elevenlabs>=1.0.0",
    "faster-whisper>=1.0.0",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
v2 = ["llama-cpp-python>=0.3", "piper-tts>=1.3", "scipy"]
ui = ["PySide6-Essentials>=6.6", "certifi"]
app = ["pyinstaller>=6.0"]

[project.scripts]
raven = "raven.launcher:main"
raven-speak = "raven.speak:main"
raven-voice = "raven.voicecmd:main"
raven2 = "raven2.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["raven*", "raven2*"]

[tool.setuptools.package-data]
raven = ["prompts/*.md"]
raven2 = ["personas_builtin/*.toml", "assets/*"]
