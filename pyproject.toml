[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "raven"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "python-dotenv>=1.0.0",
    "elevenlabs>=1.0.0",
    "faster-whisper>=1.0.0",
]

[project.scripts]
raven = "raven.launcher:main"
raven-speak = "raven.speak:main"
raven-voice = "raven.voicecmd:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["raven*"]

[tool.setuptools.package-data]
raven = ["prompts/*.md"]
